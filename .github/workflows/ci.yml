name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.12.2, stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: damianmr/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # rhysd/action-setup-vim v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: make test

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: damianmr/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # JohnnyMorganz/stylua-action v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.6.0
          args: --check lua plugin tests
