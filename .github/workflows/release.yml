name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version tag, such as v0.1.0"
        required: true
        type: string
      notes:
        description: "Summary and upgrade instructions (optional)"
        required: false
        type: string
      dry_run:
        description: "Run all checks without creating a tag or release"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate branch and version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run releases from the main branch."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must use vMAJOR.MINOR.PATCH, such as v0.1.0."
            exit 1
          fi
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" --jq '.[].ref')"
          while IFS= read -r ref; do
            if [[ "$ref" == "refs/tags/$VERSION" ]]; then
              echo "::error::This version tag already exists. Choose a new version."
              exit 1
            fi
          done <<< "$refs"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.notes }}
    steps:
      - name: Tag the tested commit and publish
        shell: bash
        run: |
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$VERSION" -f "sha=$GITHUB_SHA" > /dev/null; then
            # A retry may find the tag from an earlier publication attempt.
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '.object.sha')"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::The version tag points to a different commit."
              exit 1
            fi
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "zenon $VERSION" \
            --generate-notes --notes "$RELEASE_NOTES"
